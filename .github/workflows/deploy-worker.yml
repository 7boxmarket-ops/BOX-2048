
name: Deploy BOX 2048 Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'BOX-2048-GitHub-Release.zip'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project archive
        run: |
          set -euo pipefail
          test -f BOX-2048-GitHub-Release.zip
          mkdir -p extracted
          unzip -q -o BOX-2048-GitHub-Release.zip -d extracted

          WORKER_DIR="extracted/box-2048/worker"
          test -f "$WORKER_DIR/worker.js"
          test -f "$WORKER_DIR/wrangler.toml"
          test -f "$WORKER_DIR/site.zip"

          echo "WORKER_DIR=$WORKER_DIR" >> "$GITHUB_ENV"
          echo "Worker files verified."

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.WORKER_DIR }}
          command: deploy
