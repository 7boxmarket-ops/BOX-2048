name: Deploy BOX 2048 Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'BOX-2048-GitHub-Release.zip'
      - '.github/workflows/deploy-worker.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: box-2048-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail
          test -s BOX-2048-GitHub-Release.zip
          unzip -t BOX-2048-GitHub-Release.zip

      - name: Extract and verify Worker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -q -o BOX-2048-GitHub-Release.zip -d extracted

          WORKER_DIR="extracted/box-2048/worker"

          test -s "$WORKER_DIR/worker.js"
          test -s "$WORKER_DIR/wrangler.toml"
          test -s "$WORKER_DIR/site.zip"

          echo "WORKER_DIR=$WORKER_DIR" >> "$GITHUB_ENV"

          echo "All Worker files verified."

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.WORKER_DIR }}
          command: deploy
