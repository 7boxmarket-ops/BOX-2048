name: Build BOX 2048 Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract package and find game files
        shell: bash
        run: |
          set -e
          mkdir -p project
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1 || true)"
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d project
            ROOT="project"
          else
            ROOT="."
          fi
          INDEX="$(find "$ROOT" -type f -name index.html -not -path '*/node_modules/*' | sort | head -n 1)"
          if [ -z "$INDEX" ]; then
            echo "ERROR: site index.html not found. Upload BOX-2048-GitHub-Release.zip to repository root."
            exit 1
          fi
          echo "SITE_DIR=$ROOT/$(dirname "${INDEX#"$ROOT"/}")" >> "$GITHUB_ENV"
          RES="$(find "$ROOT" -type d -name android-res -not -path '*/node_modules/*' | head -n 1 || true)"
          echo "ANDROID_RES=$RES" >> "$GITHUB_ENV"
          echo "Using game files: $(dirname "$INDEX")"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -e
          mkdir app
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp -R "../${SITE_DIR}/." www/
          npx cap init "BOX 2048" com.sevenbox.box2048 --web-dir www
          npx cap add android
          if [ -n "${ANDROID_RES}" ] && [ -d "../${ANDROID_RES}" ]; then
            cp -R "../${ANDROID_RES}/." android/app/src/main/res/
          fi
          npx cap sync android

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing one or more Android signing secrets. See README.md."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/app/android/keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/android/keystore/release.jks"
          test -s "$GITHUB_WORKSPACE/app/android/keystore/release.jks"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/android/keystore/release.jks" >> "$GITHUB_ENV"
          cat >> "$GITHUB_WORKSPACE/app/android/app/build.gradle" <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Build signed Release APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BOX-2048.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOX-2048-Android-Release
          path: BOX-2048.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: BOX 2048 Android Release ${{ github.event_name == 'push' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            BOX 2048 by 7BOX
            Signed Android Release APK.
            Package: com.sevenbox.box2048
          files: BOX-2048.apk
          generate_release_notes: true
