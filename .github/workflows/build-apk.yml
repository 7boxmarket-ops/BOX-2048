name: BOX 2048 - Automatic Release Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: box2048-release
  cancel-in-progress: false

jobs:
  build:
    name: Extract ZIP and Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. استخراج خودکار فایل ZIP
      - name: Automatic ZIP Extraction
        shell: bash
        run: |
          set -e

          mkdir -p _project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -o -q "$ZIP_FILE" -d _project
          else
            echo "No ZIP found. Using repository files."
            cp -R . _project/
          fi

          INDEX=$(find _project -type f -path "*/site/index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            INDEX=$(find _project -type f -name index.html | head -n 1)
          fi

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX")
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"

          RES_DIR=$(find _project -type d -name android-res | head -n 1 || true)
          echo "RES_DIR=$RES_DIR" >> "$GITHUB_ENV"

          echo "Game files found: $SITE_DIR"

      # 3. نصب Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. نصب Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. بررسی رمزهای Release
      - name: Check Signing Secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASS" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASS" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      # 7. ساخت پروژه اندروید
      - name: Create Android Project
        run: |
          set -e

          mkdir -p android-build/www
          cp -R "$SITE_DIR"/. android-build/www/

          cd android-build

          npm init -y

          npm install \
            @capacitor/core@6.2.1 \
            @capacitor/cli@6.2.1 \
            @capacitor/android@6.2.1

          npx cap init "BOX 2048" "com.sevenbox.box2048" --web-dir www

          npx cap add android
          npx cap sync android

          if [ -n "$RES_DIR" ]; then
            cp -R "$RES_DIR"/. android/app/src/main/res/
          fi

          # حالت عمودی بازی
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              "<activity ",
              '<activity android:screenOrientation="portrait" ',
              1
          )

          p.write_text(s)
          PY

      # 8. آماده‌سازی کلید امضا
      - name: Decode Release Keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE" | base64 --decode \
            > "$RUNNER_TEMP/box2048-release.jks"

          test -s "$RUNNER_TEMP/box2048-release.jks"

      # 9. تنظیم امضای نسخه Release
      - name: Configure Release Signing
        working-directory: android-build/android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("STORE_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/box2048-release.jks

      # 10. ساخت APK رسمی
      - name: Build Release APK
        working-directory: android-build/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      # 11. بررسی و آماده‌سازی خروجی
      - name: Collect APK
        run: |
          set -e

          APK=$(find android-build/android/app/build/outputs/apk/release \
            -name "*.apk" | head -n 1)

          test -n "$APK"

          cp "$APK" BOX-2048.apk

          ls -lh BOX-2048.apk

      # 12. ذخیره فایل APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOX-2048-Android-Release
          path: BOX-2048.apk
          retention-days: 30

      # 13. انتشار خودکار در GitHub Releases
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: box-2048-v1.0.${{ github.run_number }}
          name: BOX 2048 Android v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: BOX-2048.apk
