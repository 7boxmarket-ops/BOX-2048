name: Build Android APK

# Upload the project .zip to the repository root (or push the extracted files).
# This workflow extracts the zip by itself, wraps the game with Capacitor
# and builds an installable BOX-2048.apk. Find it under "Releases".

on:
  push:
    branches: [main]
    paths: ["*.zip", "site/**", "android-res/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-extract the project zip
        run: |
          mkdir -p project
          ZIP=$(ls -S ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -q -o "$ZIP" -d project
          else
            echo "No zip in the repository root, using the repository files"
            tar --exclude=./.git --exclude=./project -cf - . | tar -xf - -C project
          fi
          INDEX=$(find project -name index.html -not -path "*/node_modules/*" | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d" " -f2-)
          if [ -z "$INDEX" ]; then echo "index.html was not found"; exit 1; fi
          echo "SITE=$(dirname "$INDEX")" >> "$GITHUB_ENV"
          echo "RES=$(find project -type d -name android-res | head -n 1)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: |
          mkdir app
          cd app
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp -r "../$SITE/." www/
          npx cap init "BOX 2048" com.sevenbox.box2048 --web-dir www
          npx cap add android
          if [ -n "$RES" ]; then cp -r "../$RES/." android/app/src/main/res/; fi
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk BOX-2048.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BOX-2048-apk
          path: BOX-2048.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BOX 2048 (build ${{ github.run_number }})
          body: Download BOX-2048.apk on your Android phone and install it.
          files: BOX-2048.apk
